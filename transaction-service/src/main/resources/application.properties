spring.application.name=transaction-service
server.port=8082
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=bank-transactions
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.tool-callback-converter=false
spring.datasource.url=jdbc:h2:file:${TRANSACTION_DB_PATH:./data/transactions};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

bank.transaction.max-amount=1000
bank.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.account-service.connectTimeout=1000
spring.cloud.openfeign.client.config.account-service.readTimeout=2000

# Un circuit partagé par tous les appels vers account-service ; aucun fallback bancaire.
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
spring.cloud.circuitbreaker.bulkhead.resilience4j.enabled=false
spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.httpclient.hc5.connection-request-timeout=1
spring.cloud.openfeign.httpclient.hc5.connection-request-timeout-unit=seconds
resilience4j.circuitbreaker.instances.accountService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=4
resilience4j.circuitbreaker.instances.accountService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.accountService.automatic-transition-from-open-to-half-open-enabled=false
resilience4j.circuitbreaker.instances.accountService.ignore-exception-predicate=ma.enset.adria.transaction.service.client.IgnoreAccountClientErrors
