spring.application.name=transaction-service
server.port=8082
spring.datasource.url=jdbc:h2:file:${TRANSACTION_DB_PATH:./data/transactions};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

bank.transaction.max-amount=1000
bank.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.account-service.connectTimeout=1000
spring.cloud.openfeign.client.config.account-service.readTimeout=2000
